<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Step 2: Queensland libraries</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <h1>Step 2: Queensland libraries</h1>
  <div id="vis">If you can read this, the map did not load.</div>
  <script>
    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 700,
      "height": 520,
      "title": "Test: map file only",
      "projection": {"type": "mercator"},
      "data": {
        "url": "data/qld_lga.topojson",
        "format": {"type": "topojson", "feature": "qld_lga"}
      },
      "mark": {"type": "geoshape", "fill": "lightgray", "stroke": "#555", "strokeWidth": 0.5},
      "encoding": {
        "tooltip": [
          {"field": "properties.lga_code_2021", "type": "nominal", "title": "Code"},
          {"field": "properties.lga_name_2021", "type": "nominal", "title": "Name"}
        ]
      }
    };
             
    vegaEmbed("#vis", spec, {actions: false}).catch(err => {
      document.getElementById("vis").textContent = "Error: " + err.message;
    });
  </script>
</body>
</html>
