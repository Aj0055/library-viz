<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Step 2: Queensland libraries</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <h1>Step 2: Queensland libraries</h1>
  <div id="vis">If you can read this, the map did not load.</div>
  <div id="vis2">If you can read this, the second map did not load.</div>

  <script>
    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 700,
      "height": 520,
      "title": "Loans per resident, 2024-25",
      "projection": {"type": "conicEqualArea", "parallels": [-12, -28], "rotate": [-145, 0]},
      "layer": [
        {
          "data": {
            "url": "data/qld_lga.topojson",
            "format": {"type": "topojson", "feature": "qld_lga"}
          },
          "mark": {"type": "geoshape", "fill": "lightgray", "stroke": "white"}
        },
        {
          "data": {
            "url": "data/qld_lga.topojson",
            "format": {"type": "topojson", "feature": "qld_lga"}
          },
          "transform": [
            {
              "lookup": "properties.code",
              "from": {
                "data": {
                  "url": "data/library_stats.csv",
                  "format": {"type": "csv", "parse": {"lga_code_2021": "string"}}
                },
                "key": "lga_code_2021",
                "fields": ["name", "usage_pc", "members_pct"]
              }
            },
            {"filter": "isValid(datum.usage_pc)"}
          ],
          "mark": {"type": "geoshape", "stroke": "white"},
          "encoding": {
            "color": {
              "field": "usage_pc",
              "type": "quantitative",
              "title": "Loans per resident",
              "scale": {
                "type": "threshold",
                "domain": [2, 4, 6, 8],
                "range": ["#e3efee", "#b7d6d4", "#7fb3b2", "#46888b", "#1f5559"]
              }
            },
            "tooltip": [
              {"field": "name", "type": "nominal", "title": "Council"},
              {"field": "usage_pc", "type": "quantitative", "title": "Loans per resident"},
              {"field": "members_pct", "type": "quantitative", "title": "Members % of population"}
            ]
          }
        }
      ]
    };

    vegaEmbed("#vis", spec, {actions: false}).catch(err => {
      document.getElementById("vis").textContent = "Error: " + err.message;
    });

    const spec2 = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 700,
      "height": 520,
      "title": "Physical library visits, 2024-25",
      "projection": {"type": "conicEqualArea", "parallels": [-12, -28], "rotate": [-145, 0]},
      "layer": [
        // Layer 1: Background Base Map
        {
          "data": {
            "url": "data/qld_lga.topojson",
            "format": {"type": "topojson", "feature": "qld_lga"}
          },
          "mark": {"type": "geoshape", "fill": "#e0e0e0", "stroke": "white", "strokeWidth": 0.5}
        },
        // Layer 2: Proportional Symbol Map (Centroids)
        {
          "data": {
            "url": "data/qld_lga.topojson",
            "format": {"type": "topojson", "feature": "qld_lga"}
          },
          "transform": [
            {
              "lookup": "properties.code",
              "from": {
                "data": {
                  "url": "data/library_stats.csv",
                  "format": {"type": "csv", "parse": {"lga_code_2021": "string"}}
                },
                "key": "lga_code_2021",
                "fields": ["name", "visits"]
              }
            },
            {"filter": "isValid(datum.visits) && datum.visits > 0"}
          ],
          "mark": {
            "type": "geoshape",
            "point": {"color": "#1f5559", "fill": "#46888b", "opacity": 0.7, "strokeWidth": 1}
          },
          "encoding": {
            "size": {
              "field": "visits",
              "type": "quantitative",
              "title": "Total Annual Visits",
              "scale": {"type": "sqrt", "range": [20, 1500]}
            },
            "tooltip": [
              {"field": "name", "type": "nominal", "title": "Council"},
              {"field": "visits", "type": "quantitative", "title": "Visits", "format": ","}
            ]
          }
        }
      ]
    };

    vegaEmbed("#vis2", spec2, {actions: false}).catch(err => {
      document.getElementById("vis2").textContent = "Error: " + err.message;
    });
  </script>
</body>
</html>
